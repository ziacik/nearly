name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - feature/nearly-mvp

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/nearly-mvp

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Verify scaffold
        run: gradle :shared:testDebugUnitTest :mobile:assembleDebug :wear:assembleDebug --stacktrace

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.5.0

      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          if ! git diff --cached --quiet; then
            git commit -m "chore: add Gradle wrapper"
            git push origin HEAD:feature/nearly-mvp
          fi
