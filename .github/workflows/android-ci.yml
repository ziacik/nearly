name: Android CI

on:
  push:
    branches:
      - master
      - feature/nearly-mvp
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Verify project
        run: |
          ./gradlew \
            :shared:testDebugUnitTest \
            :mobile:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :mobile:lintDebug \
            :wear:lintDebug \
            :mobile:assembleDebug \
            :wear:assembleDebug \
            :mobile:assembleAndroidTest \
            :wear:assembleAndroidTest \
            --stacktrace

      - name: Verify stable debug signing identity
        run: |
          expected='5f9411cd7cdab69e8c53008855c42ab9eba668a3c5381757ce38ed015ff60d41'
          mobile="$(apksigner verify --print-certs mobile/build/outputs/apk/debug/mobile-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          wear="$(apksigner verify --print-certs wear/build/outputs/apk/debug/wear-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$mobile" = "$expected"
          test "$wear" = "$expected"

      - name: Verify no internet permission or client slipped in
        run: |
          if grep -R -E 'Retrofit|OkHttp|HttpURLConnection|Firebase|android.permission.INTERNET' mobile/src wear/src shared/src; then
            echo 'Unexpected internet/cloud implementation found.'
            exit 1
          fi

      - name: Inspect packaged permissions
        run: |
          apkanalyzer manifest permissions mobile/build/outputs/apk/debug/mobile-debug.apk
          apkanalyzer manifest permissions wear/build/outputs/apk/debug/wear-debug.apk

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: nearly-debug-apks
          path: |
            mobile/build/outputs/apk/debug/mobile-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
